#!/usr/sbin/nft -f
# /etc/nftables.conf — R3 (Debian_NFtables) — servidor de comunicacions GNU/Linux
# WAN: enp0s3 (NAT VirtualBox, DHCP 10.0.2.x)   LAN: enp0s8 (LAN13, 192.168.13.3/24)
# Requisit: net.ipv4.ip_forward=1 (/etc/sysctl.d/99-router.conf)
# Política: tot el que no està permés explícitament es descarta i es registra.
flush ruleset

define WAN = "enp0s3"
define LAN = "enp0s8"
define LAN_NET = 192.168.13.0/24

table inet filtre {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    iifname $LAN ip saddr $LAN_NET tcp dport 22 accept           comment "SSH de gestió només des de la LAN"
    iifname $LAN udp dport { 53, 67 } accept                    comment "DNS i DHCP (dnsmasq) per a la LAN"
    iifname $LAN tcp dport 53 accept
    ip protocol icmp icmp type { echo-request } limit rate 10/second accept
    log prefix "NFT-IN-DROP " level info
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    # Connexió BLOQUEJADA de prova: SSH (tcp/22) cap a Internet des de la LAN, amb registre
    iifname $LAN oifname $WAN tcp dport 22 counter log prefix "NFT-FWD-BLOQ-SSH " level warn drop
    # Connexions PERMESES: la LAN pot eixir a Internet (web, DNS, NTP, ping...)
    iifname $LAN oifname $WAN ip saddr $LAN_NET counter log prefix "NFT-FWD-OK " level info accept
    log prefix "NFT-FWD-DROP " level info
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table ip nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname $WAN ip saddr $LAN_NET masquerade
  }
}
# NOTA: la regla "NFT-FWD-OK" registra cada connexió nova. És útil per a l'evidència;
# després de la prova es pot llevar el "log" per no omplir el journal (optimització).
