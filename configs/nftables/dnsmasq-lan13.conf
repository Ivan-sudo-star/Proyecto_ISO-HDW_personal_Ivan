# /etc/dnsmasq.d/lan13.conf — DHCP i DNS a la LAN. Només un DHCP actiu a la LAN: si R1 està encés, aquest servei es para (systemctl stop dnsmasq)
interface=enp0s8
bind-interfaces
domain=lan13.local
dhcp-range=192.168.13.100,192.168.13.200,255.255.255.0,12h
dhcp-option=option:router,192.168.13.3
dhcp-option=option:dns-server,192.168.13.3
server=1.1.1.1
server=9.9.9.9
log-dhcp
