    postToHost(&quot;height&quot;, {

    &quot;message&quot;,

    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();

<script>
(()=>{
const frame=document.getElementById('codex-visualization'),message=document.getElementById('tg-file-message');
const embedded=frame.getAttribute('data-srcdoc')||frame.getAttribute('srcdoc')||frame.srcdoc;
const rx=/<script type="application\/json" id="thinklab-config">([\s\S]*?)<\/script>/;
const startup=JSON.parse(embedded.match(rx)[1]);
document.getElementById('tg-generation').hidden=startup.role!=='teacher';
let dirty=false,handle=null,resolver=null,latest=null;
const say=t=>message.textContent=t;
const send=(type,extra={})=>frame.contentWindow.postMessage({type,...extra},'*');
const snapshot=()=>new Promise((resolve,reject)=>{if(resolver){reject(Error('Espera que acabe el desament anterior'));return;}const timeout=setTimeout(()=>{resolver=null;reject(Error('No s’ha pogut llegir el seguiment. Torna-ho a intentar.'));},5000);resolver=v=>{clearTimeout(timeout);resolver=null;resolve(v);};send('tg-request');});
const documentData=v=>({format:'thinklab-editor-guide',version:1,role:v.config.role,templateId:v.config.templateId,savedAt:new Date().toISOString(),...(v.config.role==='teacher'?{config:v.config}:{}),state:v.state});
function download(text,name,type='text/plain;charset=utf-8'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function load(text){const d=JSON.parse(text);if(d.format!=='thinklab-editor-guide'||d.version!==1)throw Error('Este fitxer no és una plantilla o seguiment d’este editor');send('tg-load',{document:d});}
function makeGuide(config){
 const copy=document.documentElement.cloneNode(true),f=copy.querySelector('#codex-visualization');
 const json=JSON.stringify(config).replace(/</g,'\\u003c');
 const safeEmbedded=embedded.replace(/<script type="application\/json" id="codex-visualization-widget-state">[\s\S]*?<\/script>/,()=>'<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>');
 const content=safeEmbedded.replace(rx,()=>'<script type="application/json" id="thinklab-config">'+json+'<\/script>');
 f.setAttribute('data-srcdoc',content);f.removeAttribute('srcdoc');
 const title=copy.querySelector('title');if(title)title.textContent=config.mode==='Individual'?'Guia individual · ThinkLab':'Guia de grup · ThinkLab';
 const gen=copy.querySelector('#tg-generation');if(gen)gen.hidden=true;
 const msg=copy.querySelector('#tg-file-message');if(msg)msg.textContent='Sense fitxer obert';
 return '<!doctype html>\n'+copy.outerHTML;
}
window.addEventListener('message',e=>{
 if(e.source!==frame.contentWindow)return;
 if(e.data?.type==='tg-state'){latest=e.data;if(e.data.dirty){dirty=true;say('Canvis sense desar');}if(resolver)resolver(latest);}
 if(e.data?.type==='tg-loaded'){dirty=false;say('Fitxer carregat'+(handle?' · '+handle.name:''));}
 if(e.data?.type==='tg-error'){handle=null;say('No s’ha carregat: '+e.data.message);}
 if(e.data?.type==='tg-exported'&&startup.role==='teacher'){
  const name=e.data.config.mode==='Individual'?'guia-individual.html':'guia-grup.html';
  download(makeGuide(e.data.config),name,'text/html;charset=utf-8');
  say('Guia generada amb la plantilla actual'+(e.data.missing.length?' · Atenció: hi ha buits de cobertura dels RAs':''));
 }
});
document.getElementById('tg-open').onclick=async()=>{if(dirty&&!confirm('Hi ha canvis sense desar. Vols carregar un altre fitxer?'))return;try{if(window.showOpenFilePicker){const [h]=await showOpenFilePicker({types:[{description:'Plantilla o seguiment ThinkLab',accept:{'text/plain':['.txt'],'application/json':['.json']}}]});const text=await(await h.getFile()).text();handle=h;load(text);}else document.getElementById('tg-input').click();}catch(e){if(e.name!=='AbortError')say(e.message);}};
document.getElementById('tg-input').onchange=async e=>{try{const file=e.target.files[0];if(file){handle=null;load(await file.text());}}catch(err){say('No s’ha carregat: '+err.message);}e.target.value='';};
const filename=()=>startup.role==='teacher'?'plantilla-rubriques.txt':startup.mode==='Individual'?'seguiment-individual.txt':'seguiment-grup.txt';
document.getElementById('tg-save').onclick=async()=>{try{if(!handle&&window.showSaveFilePicker)handle=await showSaveFilePicker({suggestedName:filename(),types:[{description:'Dades ThinkLab',accept:{'text/plain':['.txt']}}]});const value=await snapshot(),text=JSON.stringify(documentData(value),null,2);if(!handle){download(text,filename());say('Còpia descarregada · guarda-la per a continuar en una altra sessió');return;}const writer=await handle.createWritable();await writer.write(text);await writer.close();dirty=false;say('Fitxer desat · '+handle.name);}catch(e){if(e.name!=='AbortError')say('No s’ha pogut desar: '+e.message+' · Pots descarregar una còpia.');}};
document.getElementById('tg-backup').onclick=async()=>{try{const value=await snapshot();download(JSON.stringify(documentData(value),null,2),filename());say('Còpia descarregada');}catch(e){say(e.message);}};
document.getElementById('tg-export-individual').onclick=()=>send('tg-export',{mode:'Individual'});
document.getElementById('tg-export-group').onclick=()=>send('tg-export',{mode:'Grupal'});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
})();
</script>
